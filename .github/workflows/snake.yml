name: generate snake animation

on:
  schedule:
    - cron: "0 6 * * *"   # daily
  workflow_dispatch:       # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate brand-colored snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4d00&color_dots=#161b22,#3a1503,#7a2a04,#c33f02,#ff4d00
            dist/github-snake-light.svg?palette=github-light&color_snake=#e04400&color_dots=#ebedf0,#ffd8c2,#ffab7a,#ff7733,#e04400

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
